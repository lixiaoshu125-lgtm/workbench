<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>个人工作台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- 页面模板。内容不要改这里，改上一层的“口令册数据.md”，再双击“打开个人工作台”。 -->
<style>
/* 版式：顶栏（标题 + 搜索）→ 左侧目录 + 右侧一次只显示一个工作流。节点默认收起成一行，点开填空、复制。 */
:root{
  --ground:#0c0f14; --ground-2:#10141b;
  --panel:#141921; --panel-2:#191f29; --panel-glass:rgba(16,20,27,.86);
  --rule:#232a35; --rule-2:#323b49;
  --ink:#ece8df; --ink-2:#a9aeb8; --ink-3:#6f7683;
  --amber:#e2a94e; --amber-ink:#f0c47e; --amber-soft:rgba(226,169,78,.11); --amber-line:rgba(226,169,78,.5);
  --ok:#86c9a9; --ok-soft:rgba(134,201,169,.09); --ok-line:rgba(134,201,169,.42);
  --info:#8fb0e0; --info-soft:rgba(143,176,224,.08); --info-line:rgba(143,176,224,.38);
  --bad:#e88c80; --on-amber:#1b1306;
  --toast-bg:#ece8df; --toast-fg:#12161d;
  --shadow:0 10px 30px rgba(0,0,0,.3);
  --body:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Noto Sans SC",system-ui,sans-serif;
  --mono:"Cascadia Mono","JetBrains Mono",Consolas,ui-monospace,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --ground:#eef0f3; --ground-2:#f6f7f9;
    --panel:#fcfcfd; --panel-2:#f3f4f7; --panel-glass:rgba(246,247,249,.9);
    --rule:#dde1e7; --rule-2:#c8ced8;
    --ink:#161a21; --ink-2:#4a5160; --ink-3:#7d8492;
    --amber:#a5660c; --amber-ink:#8a5208; --amber-soft:rgba(165,102,12,.08); --amber-line:rgba(165,102,12,.45);
    --ok:#2b7d58; --ok-soft:rgba(43,125,88,.07); --ok-line:rgba(43,125,88,.4);
    --info:#3a5f97; --info-soft:rgba(58,95,151,.06); --info-line:rgba(58,95,151,.32);
    --bad:#b5473a; --on-amber:#ffffff;
    --toast-bg:#161a21; --toast-fg:#f5f6f8;
    --shadow:0 8px 24px rgba(30,40,60,.08);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --ground:#eef0f3; --ground-2:#f6f7f9;
  --panel:#fcfcfd; --panel-2:#f3f4f7; --panel-glass:rgba(246,247,249,.9);
  --rule:#dde1e7; --rule-2:#c8ced8;
  --ink:#161a21; --ink-2:#4a5160; --ink-3:#7d8492;
  --amber:#a5660c; --amber-ink:#8a5208; --amber-soft:rgba(165,102,12,.08); --amber-line:rgba(165,102,12,.45);
  --ok:#2b7d58; --ok-soft:rgba(43,125,88,.07); --ok-line:rgba(43,125,88,.4);
  --info:#3a5f97; --info-soft:rgba(58,95,151,.06); --info-line:rgba(58,95,151,.32);
  --bad:#b5473a; --on-amber:#ffffff;
  --toast-bg:#161a21; --toast-fg:#f5f6f8;
  --shadow:0 8px 24px rgba(30,40,60,.08);
  color-scheme:light;
}

*{box-sizing:border-box}
body{background:var(--ground); color:var(--ink); font:14px/1.7 var(--body); -webkit-font-smoothing:antialiased}
button,input{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--amber); outline-offset:2px}
a{color:var(--amber-ink)}

/* 顶栏 */
.top{position:sticky; top:0; z-index:20; background:var(--panel-glass); border-bottom:1px solid var(--rule);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:1160px; margin:0 auto; padding:10px max(16px, env(safe-area-inset-right,0px)) 10px max(16px, env(safe-area-inset-left,0px)); display:flex; gap:16px; align-items:center; flex-wrap:wrap}
.brand{display:flex; align-items:baseline; gap:10px; min-width:0}
.brand b{font-size:17px; letter-spacing:.04em; white-space:nowrap}
.brand span{font-size:12px; color:var(--ink-3); white-space:nowrap}
.search{flex:1 1 220px; position:relative; min-width:0; max-width:420px; margin-left:auto}
.search svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--ink-3)}
.search input{width:100%; height:34px; padding:0 12px 0 33px; border-radius:9px; border:1px solid var(--rule); background:var(--ground-2); outline:none}
.search input:focus{border-color:var(--amber-line)}
.search input::placeholder{color:var(--ink-3)}

.shell{max-width:1160px; margin:0 auto; padding:18px max(16px, env(safe-area-inset-right,0px)) 40px max(16px, env(safe-area-inset-left,0px))}
.warnbox{margin-bottom:14px; padding:10px 14px; border-radius:10px; border:1px solid var(--amber-line); background:var(--amber-soft); font-size:13px}

/* 主体 */
.layout{display:grid; grid-template-columns:190px minmax(0,1fr); gap:22px; align-items:start}
.rail{position:sticky; top:72px; display:flex; flex-direction:column; gap:1px}
.rail .grp{font:500 11px/1 var(--mono); letter-spacing:.14em; color:var(--ink-3); padding:12px 10px 6px}
.rail .grp:first-child{padding-top:2px}
.rail a{display:flex; justify-content:space-between; gap:8px; align-items:baseline; text-decoration:none; padding:6px 10px; border-radius:8px; color:var(--ink-2); border:1px solid transparent; line-height:1.4; cursor:pointer}
.rail a:hover{color:var(--ink); background:var(--panel)}
.rail a.on{color:var(--ink); background:var(--panel); border-color:var(--rule)}
.rail a.on span:first-child::before{content:""; display:inline-block; width:5px; height:5px; border-radius:50%; background:var(--amber); margin-right:7px; vertical-align:middle; transform:translateY(-2px)}
.rail a small{font:400 11px/1 var(--mono); color:var(--ink-3)}
.rail a.dim{opacity:.35}

main{min-width:0; display:flex; flex-direction:column; gap:16px}
.wf{min-width:0; background:var(--panel); border:1px solid var(--rule); border-radius:14px; padding:18px 20px 16px; box-shadow:var(--shadow)}
.wf-head{display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center}
.wf h2{margin:0; font-size:19px; font-weight:700; letter-spacing:.02em}
.tags{display:flex; gap:5px; flex-wrap:wrap}
.tag{font-size:11px; line-height:1; padding:4px 8px; border-radius:99px; border:1px solid var(--rule-2); color:var(--ink-3)}
.tools{margin-left:auto; display:flex; gap:6px}
.meta{display:grid; grid-template-columns:4.2em minmax(0,1fr); gap:2px 10px; margin:8px 0 0; font-size:13px}
.meta dt{color:var(--ink-3)}
.meta dd{margin:0; color:var(--ink-2)}
.desc{color:var(--ink-2); margin:6px 0 0; font-size:13px}

.btn{display:inline-flex; align-items:center; gap:5px; height:26px; padding:0 9px; border-radius:7px; border:1px solid var(--rule-2); background:transparent; color:var(--ink-2); font-size:12px; cursor:pointer; white-space:nowrap}
.btn:hover{color:var(--ink); border-color:var(--amber-line)}

/* 文件 */
.files{display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:6px; margin-top:12px}
.file{display:flex; gap:8px; align-items:center; padding:6px 8px 6px 10px; border:1px solid var(--rule); border-radius:9px; background:var(--panel-2); min-width:0; cursor:pointer; text-align:left}
.file:hover{border-color:var(--amber-line)}
.file .ic{flex:none; color:var(--amber); display:grid}
.file .fi{flex:1; min-width:0; line-height:1.4}
.file .fn{font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.file .fn em{font-style:normal; font-weight:400; color:var(--ink-3); margin-left:6px}
.file .fp{font:400 11px/1.4 var(--mono); color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; direction:rtl; text-align:left}
.file .fp bdi{direction:ltr; unicode-bidi:isolate}
.file.miss{border-color:var(--bad)}
.missing{font-size:11px; color:var(--bad); margin-left:6px}

/* 填空栏 */
.fill{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; align-items:center}
.fill > b{font-size:12px; font-weight:500; color:var(--ink-3); margin-right:2px}
.field{display:flex; align-items:center; gap:6px; flex:1 1 200px; min-width:0; max-width:360px; height:30px; border:1px solid var(--rule); border-radius:8px; background:var(--ground-2); padding:0 4px 0 9px}
.field > span{font-size:12px; color:var(--amber-ink); white-space:nowrap}
.field input{flex:1; min-width:30px; background:transparent; border:0; outline:none; padding:3px 2px; font-size:13px}
.field input::placeholder{color:var(--ink-3)}
.field:focus-within{border-color:var(--amber-line)}
.field.filled{border-color:var(--ok-line)}
.chip{border:1px solid var(--rule-2); background:transparent; border-radius:6px; padding:0 6px; font-size:11px; color:var(--ink-2); cursor:pointer; white-space:nowrap; height:20px}

/* 背景说明、使用须知 */
.bg{margin-top:12px; border:1px solid var(--info-line); border-radius:10px; background:var(--info-soft)}
.bg > summary{list-style:none; cursor:pointer; padding:8px 12px; display:flex; gap:10px; align-items:baseline; font-size:13px}
.bg > summary::-webkit-details-marker{display:none}
.bg > summary b{color:var(--info); font-weight:700; white-space:nowrap}
.bg > summary span{color:var(--ink-3); font-size:12px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1}
.bg > summary i{font-style:normal; color:var(--ink-3); font-size:12px; white-space:nowrap}
.bg[open] > summary{border-bottom:1px solid var(--info-line)}
.bg .rich{padding:6px 14px 12px}
.tips{margin-top:10px; padding:8px 12px; border-radius:10px; border:1px solid var(--ok-line); background:var(--ok-soft); font-size:13px}
.tips h3{margin:0 0 2px; font-size:13px; color:var(--ok)}
.tips .rich ul, .tips .rich ol{margin:0}

.rich{font-size:13px; color:var(--ink-2)}
.rich h4{margin:12px 0 4px; font-size:13.5px; color:var(--ink); font-weight:700}
.rich h4:first-child{margin-top:6px}
.rich p{margin:3px 0}
.rich ul, .rich ol{margin:3px 0; padding-left:1.4em}
.rich li{margin:1px 0}
.rich li::marker{color:var(--ink-3)}
.rich code{font:12px/1.5 var(--mono); background:var(--ground-2); border:1px solid var(--rule); border-radius:4px; padding:0 4px; color:var(--ink); word-break:break-all}
.rich strong{color:var(--ink)}
.rich a{word-break:break-all}
.tblwrap{overflow-x:auto; margin:5px 0}
.rich table{border-collapse:collapse; font-size:12.5px; min-width:100%}
.rich th, .rich td{border:1px solid var(--rule); padding:3px 8px; text-align:left; vertical-align:top}
.rich th{background:var(--panel-2); color:var(--ink); font-weight:500; white-space:nowrap}

/* 节点 */
.sec{margin:16px 0 6px; display:flex; align-items:center; gap:10px; font:500 11px/1 var(--mono); letter-spacing:.14em; color:var(--ink-3)}
.sec::after{content:""; flex:1; height:1px; background:var(--rule)}
.nodes{display:flex; flex-direction:column; gap:5px}
.node{border:1px solid var(--rule); border-radius:10px; background:var(--panel-2)}
.node[open]{border-color:var(--rule-2)}
.node > summary{list-style:none; cursor:pointer; display:flex; align-items:center; gap:10px; padding:6px 8px 6px 8px; min-height:40px}
.node > summary::-webkit-details-marker{display:none}
.num{flex:none; width:30px; height:24px; display:grid; place-items:center; border-radius:6px; border:1px solid var(--amber-line); background:var(--amber-soft); color:var(--amber-ink); font:500 12px/1 var(--mono)}
.nt{flex:1; min-width:0; display:flex; gap:10px; align-items:baseline}
.nt b{font-size:14px; white-space:nowrap}
.nt span{font-size:12px; color:var(--ink-3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0}
.pc{font:400 11px/1 var(--mono); color:var(--ink-3); white-space:nowrap}
.caret{flex:none; color:var(--ink-3); transition:transform .15s; display:grid}
.node[open] .caret{transform:rotate(90deg)}
.node[open] > summary .nt span, .node[open] > summary .qcopy{display:none}
.rich td:first-child{min-width:9em; max-width:20em}
.qcopy{border:0; height:26px; padding:0 11px; border-radius:7px; background:var(--amber-soft); color:var(--amber-ink); border:1px solid var(--amber-line); font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap}
.qcopy:hover{background:var(--amber); color:var(--on-amber)}
.nbody{padding:0 12px 12px 48px}
.notes{margin:0 0 2px; font-size:13px; color:var(--ink-2)}
.notes div{margin:2px 0}
.notes b{font-weight:500; color:var(--ink); margin-right:6px}
.re{display:inline-block; font-size:12px; color:var(--ink-2); border:1px solid var(--rule-2); border-radius:99px; padding:0 9px; margin-right:6px}

.prompt{margin-top:8px; border:1px solid var(--rule-2); border-radius:9px; background:var(--ground-2); overflow:hidden}
.prompt:focus-within{border-color:var(--amber-line)}
.ph-h{display:flex; align-items:center; gap:10px; padding:4px 6px 4px 12px; border-bottom:1px solid var(--rule)}
.pl{flex:1; min-width:0; font-size:12px; color:var(--ink-3)}
.st{font:500 11px/1 var(--mono); color:var(--ink-3); white-space:nowrap}
.st.ok{color:var(--ok)}
.copy{border:0; height:26px; padding:0 13px; border-radius:7px; background:var(--amber); color:var(--on-amber); font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap}
.copy:hover{filter:brightness(1.08)}
.copy.done, .qcopy.done{background:var(--ok); color:var(--on-amber); border-color:var(--ok)}
.ptext{padding:9px 12px 11px; white-space:pre-wrap; word-break:break-word; line-height:1.95; font-size:13.5px}
.ph{display:inline-block; vertical-align:baseline; height:24px; line-height:22px; padding:0 6px; margin:0 1px; max-width:100%; min-width:3em; font-size:13px;
  border:1px dashed var(--amber-line); border-radius:6px; background:var(--amber-soft); color:var(--ink); outline:none}
.ph::placeholder{color:var(--amber-ink); opacity:.85}
.ph:focus{border-style:solid; border-color:var(--amber)}
.ph.filled{border-style:solid; border-color:var(--ok-line); background:var(--ok-soft)}
.empty-n{color:var(--ink-3); font-size:13px; margin:12px 0 0}
.nores{padding:30px; text-align:center; color:var(--ink-2); border:1px dashed var(--rule-2); border-radius:14px}
.hit-wf{font-size:12px; color:var(--ink-3); margin:-6px 0 0}

footer{margin-top:26px; padding-top:14px; border-top:1px solid var(--rule); display:flex; flex-direction:column; gap:6px; color:var(--ink-3); font-size:12px}
footer .row{display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center}
footer code{font:400 11px/1.6 var(--mono); color:var(--ink-2); word-break:break-all; min-width:0}

.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translate(-50%,14px); opacity:0; pointer-events:none; z-index:40;
  padding:8px 16px; border-radius:10px; background:var(--toast-bg); color:var(--toast-fg); font-size:13px; box-shadow:var(--shadow); max-width:calc(100% - 32px); transition:opacity .2s, transform .2s}
.toast.show{opacity:1; transform:translate(-50%,0)}

@media (max-width:860px){
  .layout{grid-template-columns:minmax(0,1fr); gap:12px}
  .rail{position:static; flex-direction:row; overflow-x:auto; gap:5px; padding-bottom:4px}
  .rail .grp{display:none}
  .rail a{flex:none; white-space:nowrap; background:var(--panel); border-color:var(--rule)}
}
@media (max-width:600px){
  .top{position:static}
  .brand span{display:none}
  .search{max-width:none}
  .wf{padding:14px 12px 12px; border-radius:12px}
  .nt span{display:none}
  .pc{display:none}
  .nbody{padding:0 10px 10px 10px}
  .files{grid-template-columns:minmax(0,1fr)}
  .meta{grid-template-columns:minmax(0,1fr)}
  .meta dt{margin-top:4px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>

<header class="top">
  <div class="top-in">
    <div class="brand"><b>个人工作台</b><span>我的工作流 · 在关键节点提醒 AI 不跳过必要环节</span></div>
    <label class="search" for="q">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="搜索全部工作流、节点、口令（按 / 键）" autocomplete="off">
    </label>
  </div>
</header>

<div class="shell">
  <div id="warn"></div>
  <div class="layout">
    <nav class="rail" id="nav" aria-label="工作流目录"></nav>
    <main id="main"></main>
  </div>
  <footer id="foot"></footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k.slice(0,2) === "on") el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (var i = 2; i < arguments.length; i++) add(el, arguments[i]);
  return el;
}
function add(el, c){

}

function copyText(text){

    var ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.top = "0"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    var ok = false; try { ok = document.execCommand("copy"); } catch(e){}
    document.body.removeChild(ta);
    return ok ? Promise.resolve() : Promise.reject();
  }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text).catch(fallback);
  } catch(e){}
  return fallback();
}

/* 解析 Markdown 数据（格式见“口令册数据.md”顶部） */
function parse(text){
  var lines = text.replace(/\r\n?/g, "\n").split("\n");
  var doc = { globalFill: null, workflows: [], warnings: [] };
  var wf = null, node = null, label = null, quote = null, inComment = false;
  function newWf(name){ var w = { name: name, purpose: "", when: "", group: "", desc: [], files: [], tags: [], nodes: [] }; doc.workflows.push(w); return w; }
  function endQuote(){
    if (!quote) return;
    while (quote.lines.length && !quote.lines[quote.lines.length - 1].trim()) quote.lines.pop();
    while (quote.lines.length && !quote.lines[0].trim()) quote.lines.shift();
    if (quote.lines.length) node.prompts.push({ label: quote.label, text: quote.lines.join("\n") });
    quote = null; label = null;
  }
  function ensureNode(i){
    if (!wf){ wf = newWf("未命名工作流"); doc.warnings.push("第 " + (i + 1) + " 行：口令写在了第一个“# 工作流名称”之前，暂时归到“未命名工作流”。"); }
    if (!node){ node = { name: "口令", kind: "step", notes: [], raw: [], prompts: [] }; wf.nodes.push(node); }
  }
  for (var i = 0; i < lines.length; i++){
    var s = lines[i];
    if (inComment){
      var e0 = s.indexOf("-->");
      if (e0 < 0) continue;
      s = s.slice(e0 + 3); inComment = false;
      if (!s.trim()) continue;
    }
    var c = s.indexOf("<!--");
    while (c >= 0){
      var e = s.indexOf("-->", c + 4);
      if (e >= 0){ s = s.slice(0, c) + s.slice(e + 3); c = s.indexOf("<!--"); }
      else { s = s.slice(0, c); inComment = true; c = -1; }
    }
    if (!s.trim() && lines[i].trim()) continue;
    var qm = s.match(/^\s*>\s?(.*)$/);
    if (qm){
      ensureNode(i);
      if (!quote) quote = { label: label, lines: [] };
      quote.lines.push(qm[1].replace(/\s+$/, ""));
      continue;
    }
    endQuote();
    var t = s.trim(), m;
    if (!t){ if (node && node.kind !== "step") node.raw.push(""); continue; }
    if ((m = t.match(/^#\s+(.+)$/))){ wf = newWf(m[1].replace(/^工作流\s*[:：]\s*/, "").trim()); node = null; label = null; continue; }
    if ((m = t.match(/^##\s+(.+)$/))){
      if (!wf) wf = newWf("未命名工作流");
      var nm = m[1].trim();
      var kind = /^背景/.test(nm) ? "bg" : (/^(使用须知|注意事项|须知)/.test(nm) ? "tips" : "step");
      node = { name: nm, kind: kind, notes: [], raw: [], prompts: [] };
      wf.nodes.push(node); label = null; continue;
    }
    if ((m = t.match(/^#{3,}\s+(.+)$/))){
      ensureNode(i);
      if (node.kind !== "step") node.raw.push(t); else label = m[1].trim();
      continue;
    }
    if (!wf){
      if ((m = t.match(/^通用填空\s*[:：]\s*(.*)$/))) doc.globalFill = splitList(m[1]);
      continue;
    }
    if ((!node || node.kind === "step") && (m = t.match(/^(文件夹|文件)\s*[:：]\s*(.+)$/))){
      var parts = m[2].split(/\s+\|\s+/);
      wf.files.push({ path: cleanPath(parts[0]), note: parts.slice(1).join(" | ").trim(), dir: m[1] === "文件夹" });
      continue;
    }
    if (!node){
      if ((m = t.match(/^用途\s*[:：]\s*(.*)$/))){ wf.purpose = m[1].trim(); continue; }
      if ((m = t.match(/^(何时用|什么时候用)\s*[:：]\s*(.*)$/))){ wf.when = m[2].trim(); continue; }
      if ((m = t.match(/^标签\s*[:：]\s*(.*)$/))){ wf.tags = splitList(m[1]); continue; }
      if ((m = t.match(/^分组\s*[:：]\s*(.*)$/))){ wf.group = m[1].trim(); continue; }
      wf.desc.push(stripBullet(t)); continue;
    }
    if (node.kind === "step") node.notes.push(stripBullet(t)); else node.raw.push(t);
  }
  endQuote();
  return doc;
}

/* 背景说明里的简易排版：小标题、段落、列表、表格、`代码`、**加粗**、网址 */
var INLINE_RE = /(`[^`]+`)|(\*\*[^*]+\*\*)|(https?:\/\/[^\s，。、；）)」』“”"<>]+)/g;
function inline(str){
  var out = [], last = 0, m;
  INLINE_RE.lastIndex = 0;
  while ((m = INLINE_RE.exec(str))){
    if (m.index > last) out.push(str.slice(last, m.index));
    if (m[1]) out.push(h("code", { text: m[1].slice(1, -1) }));
    else if (m[2]) out.push(h("strong", { text: m[2].slice(2, -2) }));
    else out.push(h("a", { href: m[3], target: "_blank", rel: "noopener", text: m[3] }));
    last = m.index + m[0].length;
  }
  if (last < str.length) out.push(str.slice(last));
  return out;
}
function renderRich(lines){
  var box = h("div", { class: "rich" }), list = null, listType = "", table = null;
  lines.forEach(function(t){
    var m;
    if (!t.trim()){ list = null; table = null; return; }
    if ((m = t.match(/^#{3,}\s+(.+)$/))){ list = null; table = null; box.appendChild(h("h4", null, inline(m[1]))); return; }
    if (/^\|.*\|\s*$/.test(t)){
      list = null;
      var cells = t.trim().slice(1, -1).split("|").map(function(x){ return x.trim(); });
      if (cells.every(function(x){ return /^:?-{2,}:?$/.test(x); })) return;
      var first = !table;
      if (first){ table = h("table"); box.appendChild(h("div", { class: "tblwrap" }, table)); }
      var tr = h("tr");
      cells.forEach(function(x){ tr.appendChild(h(first ? "th" : "td", null, inline(x))); });
      table.appendChild(tr); return;
    }
    table = null;
    if ((m = t.match(/^[-*•]\s+(.+)$/))){
      if (!list || listType !== "ul"){ list = h("ul"); listType = "ul"; box.appendChild(list); }
      list.appendChild(h("li", null, inline(m[1]))); return;
    }
    if ((m = t.match(/^\d+[.、)）]\s*(.+)$/))){
      if (!list || listType !== "ol"){ list = h("ol"); listType = "ol"; box.appendChild(list); }
      list.appendChild(h("li", null, inline(m[1]))); return;
    }
    list = null;
    box.appendChild(h("p", null, inline(t)));
  });
  return box;
}

/* 占位符 */
var PH_RE = /\[([^\[\]\n]{1,40})\]/g;
function segmentsOf(text){
  var segs = [], last = 0, m, counts = {}, seen = {};
  PH_RE.lastIndex = 0;
  while ((m = PH_RE.exec(text))){ counts[m[1].trim()] = (counts[m[1].trim()] || 0) + 1; }
  PH_RE.lastIndex = 0;
  while ((m = PH_RE.exec(text))){
    if (m.index > last) segs.push({ t: text.slice(last, m.index) });
    var name = m[1].trim();
    seen[name] = (seen[name] || 0) + 1;
    segs.push({ ph: name, key: counts[name] > 1 ? name + "#" + seen[name] : name });
    last = m.index + m[0].length;
  }
  if (last < text.length) segs.push({ t: text.slice(last) });
  return segs;
}

function sizeInput(inp){
  try { measureCtx.font = getComputedStyle(inp).font || "13px sans-serif"; } catch(e){}
  var w = measureCtx.measureText(inp.value || inp.placeholder || "").width;
  inp.style.width = Math.ceil(Math.max(w, 30) + 16) + "px";
}
var promptViews = [];
function setVal(key, v, src){
  if (v) vals[key] = v; else delete vals[key];
  save();
  document.querySelectorAll("input[data-key]").forEach(function(inp){
    if (inp.getAttribute("data-key") !== key) return;
    if (inp !== src) inp.value = v;
    var on = !!v.trim();
    if (inp.classList.contains("ph")){ inp.classList.toggle("filled", on); sizeInput(inp); }
    else if (inp.parentNode) inp.parentNode.classList.toggle("filled", on);
  });
  promptViews.forEach(function(pv){ pv.refresh(); });
}

function flash(btn, cls){
  var old = btn.textContent;
  btn.textContent = "已复制"; btn.classList.add("done");
  setTimeout(function(){ btn.textContent = old; btn.classList.remove("done"); }, 1400);
}

/* 一条口令 */
function renderPrompt(p){
  var segs = segmentsOf(p.text);
  var phs = segs.filter(function(s){ return s.ph; });
  var body = h("div", { class: "ptext" });
  var inputs = [];
  segs.forEach(function(s){
    if (!s.ph){ body.appendChild(document.createTextNode(s.t)); return; }
    var inp = h("input", { class: "ph", "data-key": s.key, placeholder: s.ph, "aria-label": "填写：" + s.ph, spellcheck: "false", autocomplete: "off" });
    inp.value = vals[s.key] || "";
    if (inp.value.trim()) inp.classList.add("filled");
    inp.addEventListener("input", function(){ setVal(s.key, inp.value, inp); });
    body.appendChild(inp); inputs.push(inp);
  });
  var st = h("span", { class: "st" });
  var btn = h("button", { class: "copy", type: "button", text: "复制" });
  function build(){
    var miss = 0;
    var out = segs.map(function(s){
      if (!s.ph) return s.t;
      var v = (vals[s.key] || "").trim();
      if (!v){ miss++; return "[" + s.ph + "]"; }
      return v;
    }).join("");
    return { text: out, miss: miss };
  }
  function refresh(){
    if (!phs.length){ st.textContent = ""; return; }
    var r = build(), filled = phs.length - r.miss;
    st.textContent = r.miss ? ("已填 " + filled + "/" + phs.length) : "已填好";
    st.classList.toggle("ok", !r.miss);
  }
  function doCopy(b){
    var r = build();
    copyText(r.text).then(function(){
      flash(b);
      toast(r.miss ? ("已复制，还有 " + r.miss + " 处没填，保留了方括号") : "已复制，可以直接粘贴给 AI");
    }, function(){ toast("复制失败，请手动选中文字复制"); });
  }
  btn.addEventListener("click", function(){ doCopy(btn); });
  var view = {
    refresh: refresh, build: build, doCopy: doCopy,
    firstEmpty: function(){ for (var i = 0; i < inputs.length; i++){ if (!inputs[i].value.trim()) return inputs[i]; } return null; }
  };
  promptViews.push(view);
  refresh();
  view.el = h("div", { class: "prompt" },
    h("div", { class: "ph-h" }, h("span", { class: "pl", text: p.label || (phs.length ? "口令 · 先填虚线框" : "口令") }), st, btn),
    body);
  return view;
}

function renderFile(f){
  var exists = payload.exists ? payload.exists[f.path] : undefined;
  return h("button", { class: "file" + (exists === false ? " miss" : ""), type: "button", title: "点一下复制路径：" + f.path, onclick: function(){
      copyText(f.path).then(function(){ toast("路径已复制。按 Win+R，粘贴，回车，就能打开"); }, function(){ toast("复制失败"); });
    } },
    h("span", { class: "ic" }, svgIcon(f.dir ? "folder" : "file")),
    h("span", { class: "fi" },
      h("div", { class: "fn" }, baseName(f.path), f.note ? h("em", { text: f.note }) : null,
        exists === false ? h("span", { class: "missing", text: "找不到" }) : null),
      h("div", { class: "fp" }, h("bdi", { text: f.path }))),
    h("span", { class: "ic", style: "color:var(--ink-3)" }, svgIcon("copy")));
}

/* 一个节点：收起时一行，点开看说明、填空、复制 */
function renderNode(n, ni){
  var d = h("details", { class: "node" });
  var snip = "";
  n.notes.forEach(function(x){ if (snip) return; var mm = x.match(/^说明\s*[:：]\s*(.+)$/); snip = mm ? mm[1] : (/^[^\s:：]{1,8}\s*[:：]/.test(x) ? "" : x); });
  var views = [];
  var body = h("div", { class: "nbody" });
  if (n.notes.length){
    body.appendChild(h("div", { class: "notes" }, n.notes.map(function(x){
      var mm = x.match(/^([^\s:：]{1,8})\s*[:：]\s*(.+)$/);
      if (mm && mm[1] === "重读") return h("span", { class: "re" }, "重读 " + mm[2]);
      if (mm && mm[1] === "说明") return h("div", null, inline(mm[2]));
      return mm ? h("div", null, h("b", { text: mm[1] }), inline(mm[2])) : h("div", null, inline(x));
    })));
  }
  n.prompts.forEach(function(p){ var v = renderPrompt(p); views.push(v); body.appendChild(v.el); });
  var q = null;
  if (views.length){
    q = h("button", { class: "qcopy", type: "button", text: "复制", title: views.length > 1 ? "复制第一条口令" : "复制口令" });
    q.addEventListener("click", function(ev){
      ev.preventDefault(); ev.stopPropagation();
      var v = views[0], r = v.build();
      if (r.miss){
        d.open = true;
        var inp = v.firstEmpty();
        if (inp){ setTimeout(function(){ inp.focus(); }, 30); }
        toast("还有 " + r.miss + " 处虚线框没填，填好再复制");
        return;
      }
      v.doCopy(q);
    });
  }
  var sum = h("summary", null,
    h("span", { class: "num", text: pad2(ni + 1) }),
    h("span", { class: "nt" }, h("b", { text: n.name }), snip ? h("span", { text: snip }) : null),
    views.length > 1 ? h("span", { class: "pc", text: views.length + " 条" }) : null,
    q,
    h("span", { class: "caret" }, svgIcon("caret")));
  d.appendChild(sum); d.appendChild(body);
  d._search = (n.name + "\n" + n.notes.join("\n") + "\n" + n.prompts.map(function(p){ return (p.label || "") + "\n" + p.text; }).join("\n")).toLowerCase();
  return d;
}

/* 工作流里出现两次以上的空，放到顶部填空栏 */
function fillNames(wf, globalFill){
  var count = {};
  wf.nodes.forEach(function(n){ n.prompts.forEach(function(p){
    var seen = {};
    segmentsOf(p.text).forEach(function(s){ if (s.ph && !seen[s.ph]){ seen[s.ph] = 1; count[s.ph] = (count[s.ph] || 0) + 1; } });
  }); });
  var names = Object.keys(count).filter(function(k){ return count[k] > 1 || (globalFill && globalFill.indexOf(k) >= 0); });
  return names;
}
function renderFill(names){
  if (!names.length) return null;
  var row = h("div", { class: "fill" }, h("b", { text: "常用填空" }));
  names.forEach(function(name){
    var inp = h("input", { "data-key": name, placeholder: "填一次，下面同名的空一起填好", spellcheck: "false", autocomplete: "off", "aria-label": name });
    inp.value = vals[name] || "";
    inp.addEventListener("input", function(){ setVal(name, inp.value, inp); });
    var f = h("label", { class: "field" + (inp.value.trim() ? " filled" : "") }, h("span", { text: name }), inp);
    if (/日期/.test(name)){
      f.appendChild(h("button", { class: "chip", type: "button", text: "今天", onclick: function(ev){
        ev.preventDefault();
        var dt = new Date(), v = dt.getFullYear() + "-" + pad2(dt.getMonth() + 1) + "-" + pad2(dt.getDate());
        inp.value = v; setVal(name, v, inp);
      } }));
    }
    row.appendChild(f);
  });
  return row;
}

var cards = [];
function render(doc){
  var main = $("main"), nav = $("nav");
  var lastGroup = null;
  doc.workflows.forEach(function(wf, wi){
    var id = "wf-" + wi;
    var steps = wf.nodes.filter(function(n){ return n.kind === "step"; });
    var tips = wf.nodes.filter(function(n){ return n.kind === "tips"; });
    var bgs = wf.nodes.filter(function(n){ return n.kind === "bg"; });

    if (wf.group !== lastGroup){ if (wf.group) nav.appendChild(h("div", { class: "grp", text: wf.group })); lastGroup = wf.group; }
    var link = h("a", { href: "#" + id, "data-target": id, onclick: function(ev){ ev.preventDefault(); show(wi, true); } },
      h("span", { text: wf.name }), h("small", { text: steps.length ? String(steps.length) : "" }));
    nav.appendChild(link);

    var card = h("article", { class: "wf", id: id });
    var nodeEls = [];
    var expandBtn = h("button", { class: "btn", type: "button", text: "全部展开", onclick: function(){
      var anyClosed = nodeEls.some(function(d){ return !d.open && !d.hidden; });
      nodeEls.forEach(function(d){ if (!d.hidden) d.open = anyClosed; });
      expandBtn.textContent = anyClosed ? "全部收起" : "全部展开";
    } });
    card.appendChild(h("div", { class: "wf-head" }, h("h2", { text: wf.name }),
      wf.tags.length ? h("div", { class: "tags" }, wf.tags.map(function(t){ return h("span", { class: "tag", text: t }); })) : null,
      steps.length ? h("div", { class: "tools" }, expandBtn) : null));
    var hitNote = h("p", { class: "hit-wf" }); hitNote.hidden = true;
    var meta = h("dl", { class: "meta" });
    if (wf.purpose){ meta.appendChild(h("dt", { text: "用途" })); meta.appendChild(h("dd", { text: wf.purpose })); }
    if (wf.when){ meta.appendChild(h("dt", { text: "何时用" })); meta.appendChild(h("dd", { text: wf.when })); }
    var headBits = h("div", null);
    if (meta.childNodes.length) headBits.appendChild(meta);
    wf.desc.forEach(function(x){ headBits.appendChild(h("p", { class: "desc" }, inline(x))); });
    if (wf.files.length) headBits.appendChild(h("div", { class: "files" }, wf.files.map(renderFile)));

    var bgEls = [];
    bgs.forEach(function(n){
      var firstLine = "";
      n.raw.forEach(function(x){ if (!firstLine && x.trim()) firstLine = x.replace(/^#{3,}\s+/, ""); });
      var heads = n.raw.filter(function(x){ return /^#{3,}\s+/.test(x); }).map(function(x){ return x.replace(/^#{3,}\s+/, ""); });
      var det = h("details", { class: "bg" },
        h("summary", null, h("b", { text: n.name }), h("span", { text: heads.length ? heads.join(" · ") : firstLine }), h("i", { text: "点开看" })),
        renderRich(n.raw));
      det.addEventListener("toggle", function(){ det.querySelector("summary i").textContent = det.open ? "收起" : "点开看"; });
      det._search = n.raw.join("\n").toLowerCase();
      headBits.appendChild(det); bgEls.push(det);
    });
    tips.forEach(function(n){
      var tb = h("div", { class: "tips" }, h("h3", { text: n.name }), renderRich(n.raw));
      n.prompts.forEach(function(p){ tb.appendChild(renderPrompt(p).el); });
      headBits.appendChild(tb);
    });
    var fill = renderFill(fillNames(wf, doc.globalFill));
    if (fill) headBits.appendChild(fill);
    card.appendChild(hitNote);
    card.appendChild(headBits);

    if (steps.length){
      card.appendChild(h("div", { class: "sec", text: "使用节点 · 按顺序 · 点一行展开" }));
      var list = h("div", { class: "nodes" });
      steps.forEach(function(n, ni){ var d = renderNode(n, ni); list.appendChild(d); nodeEls.push(d); });
      card.appendChild(list);
    } else {
      card.appendChild(h("p", { class: "empty-n", text: "这个条目只登记位置和用途，没有口令。" }));
    }
    card._head = [wf.name, wf.purpose, wf.when, wf.tags.join(" "), wf.desc.join(" "),
      wf.files.map(function(f){ return f.path + " " + f.note; }).join(" ")].join("\n").toLowerCase();
    card._tips = tips.map(function(n){ return n.raw.join("\n"); }).join("\n").toLowerCase();
    card._nodes = nodeEls; card._bgs = bgEls; card._link = link; card._headBits = headBits; card._hit = hitNote;
    cards.push(card);
    main.appendChild(card);
  });
  var nr = h("div", { id: "nores", class: "nores", text: "没有找到匹配的工作流或口令。" }); nr.hidden = true;
  main.appendChild(nr);
  if (!doc.workflows.length){
    main.appendChild(h("div", { class: "wf" }, h("h2", { text: "还没有工作流" }),
      h("p", { class: "desc", text: "在“口令册数据.md”里照着顶部的格式写一个，保存后再双击“打开个人工作台”。" })));
  }
}

/* 一次只显示一个工作流 */
var active = 0;
function show(i, scroll){
  if (!cards.length) return;
  active = Math.max(0, Math.min(cards.length - 1, i));
  lsSet(ACTIVE, String(active));
  if ($("q").value.trim()){ $("q").value = ""; applySearch(); }
  cards.forEach(function(c, ci){ c.hidden = ci !== active; c._link.classList.toggle("on", ci === active); });
  try { history.replaceState(null, "", "#" + cards[active].id); } catch(e){}
  if (scroll) window.scrollTo({ top: 0, behavior: "auto" });
}

function applySearch(){
  var k = $("q").value.trim().toLowerCase(), any = false;
  var nr = $("nores");
  if (!k){
    cards.forEach(function(c, ci){
      c.hidden = ci !== active; c._link.classList.remove("dim"); c._link.classList.toggle("on", ci === active);
      c._headBits.hidden = false; c._hit.hidden = true;
      c._nodes.forEach(function(d){ d.hidden = false; });
    });
    if (nr) nr.hidden = true;
    return;
  }
  cards.forEach(function(c){
    var headHit = c._head.indexOf(k) >= 0, n = 0;
    var bgHit = c._bgs.some(function(b){ return b._search.indexOf(k) >= 0; });
    var tipsHit = c._tips.indexOf(k) >= 0;
    c._nodes.forEach(function(d){ var hit = headHit || d._search.indexOf(k) >= 0; d.hidden = !hit; if (hit) n++; });
    var showIt = headHit || bgHit || tipsHit || n > 0;
    c.hidden = !showIt; c._link.classList.toggle("dim", !showIt); c._link.classList.remove("on");
    c._headBits.hidden = !(headHit || bgHit || tipsHit);
    c._bgs.forEach(function(b){ if (bgHit && b._search.indexOf(k) >= 0) b.open = true; });
    c._hit.hidden = !showIt;
    var where = [];
    if (n) where.push(n + " 个节点");
    if (bgHit) where.push("背景说明");
    if (tipsHit) where.push("使用须知");
    c._hit.textContent = "搜索结果：" + (headHit ? "工作流名称或用途匹配，下面是全部节点" : where.join("、") + "里有");
    if (showIt) any = true;
  });
  if (nr) nr.hidden = any;
}
function setupSearch(){
  var q = $("q");
  q.addEventListener("input", applySearch);
  document.addEventListener("keydown", function(ev){
    if (ev.key === "/" && document.activeElement && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)){ ev.preventDefault(); q.focus(); }
    if (ev.key === "Escape" && document.activeElement === q){ q.value = ""; applySearch(); }
  });
}

function renderFoot(){
  var f = $("foot");
  if (!payload){ f.hidden = true; return; }
  f.appendChild(h("div", { class: "row" },
    h("span", { text: "内容来自" }), h("code", { text: payload.dataPath || "" }),
    h("button", { class: "btn", type: "button", onclick: function(){ copyText(payload.dataPath).then(function(){ toast("数据文件路径已复制"); }, function(){ toast("复制失败"); }); } }, svgIcon("copy"), "复制路径"),
    h("button", { class: "btn", type: "button", onclick: function(){
      Object.keys(vals).forEach(function(k){ delete vals[k]; }); save();
      document.querySelectorAll("input[data-key]").forEach(function(inp){
        inp.value = "";
        if (inp.classList.contains("ph")){ inp.classList.remove("filled"); sizeInput(inp); }
        else if (inp.parentNode) inp.parentNode.classList.remove("filled");
      });
      promptViews.forEach(function(pv){ pv.refresh(); });
      toast("已清空所有填写");
    } }, "清空所有填写")));
  f.appendChild(h("div", { class: "row" },
    h("span", { text: "改完数据文件并保存后，关掉这个页面，再双击“打开个人工作台”就能看到更新。填空内容只存在这台电脑的浏览器里。本页生成于 " + (payload.generated || "") })));
}

var warn = $("warn");
function warnBox(lines){ warn.appendChild(h("div", { class: "warnbox" }, lines.map(function(x){ return h("div", { text: x }); }))); }
if (!payload){
  warnBox([loadError]);
  $("nav").hidden = true;
} else {
  var doc = parse(payload.data || "");
  var notes = doc.warnings.slice();
  if (payload.encodingNote) notes.unshift(payload.encodingNote);
  if (notes.length) warnBox(notes);
  render(doc);
  setupSearch();
  var start = 0, hm = (location.hash || "").match(/^#wf-(\d+)$/);
  if (hm) start = +hm[1]; else { var sv = parseInt(lsGet(ACTIVE) || "0", 10); if (!isNaN(sv)) start = sv; }
  show(start, false);
  requestAnimationFrame(function(){ document.querySelectorAll("input.ph").forEach(sizeInput); });
  document.addEventListener("toggle", function(ev){
    if (ev.target && ev.target.open) ev.target.querySelectorAll("input.ph").forEach(sizeInput);
  }, true);
  window.__wf = { doc: doc, ok: true };
}
renderFoot();
})();
</script>
